services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siwes}
      POSTGRES_USER: ${POSTGRES_USER:-siwes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-siwes}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-siwes}
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn siwes_api.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    depends_on:
      db: {condition: service_healthy}
    volumes: [media_data:/app/media]
  frontend:
    build:
      context: .
      args: {VITE_API_URL: /api}
    depends_on: [backend]
    ports: ["80:80"]
volumes:
  postgres_data:
  media_data:
